[project]
name = "xdr"
version = "0.1.0"
description = "Excel Defined Radio — a functional SDR whose waterfall is rendered using spreadsheet cells."
readme = "README.md"
authors = [
    { name = "cya9nide" }
]
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.4.6",
    "openpyxl>=3.1.5",
    "pyrtlsdr>=0.5.0",
    "pyrtlsdrlib>=0.0.5",
    "pytest>=9.1.1",
    "pywin32>=312",
    "sounddevice>=0.5.6",
]

[project.scripts]
xdr = "xdr:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"
